name: IPA derle

# Depoda su dosyalar ana klasorde olmali:
#   YZSohbet-proje.zip
#   project.yml
#   .github/workflows/build-ipa.yml (bu dosya)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Depodaki dosyalari goster
        run: ls -la

      - name: Zip dosyasini ac
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "HATA: Ana klasorde .zip dosyasi yok. YZSohbet-proje.zip dosyasini depoya yukle."
            exit 1
          fi
          echo "Aciliyor: ${zips[0]}"
          unzip -o -q "${zips[0]}"

          # project.yml adi degismis veya baska klasore konmus olabilir: ara ve kopyala
          if [ ! -f project.yml ]; then
            alt=$(find . -maxdepth 3 -type f \( -iname 'project*.yml*' -o -iname 'project*.yaml*' \) -not -path './.git/*' | head -n 1)
            if [ -n "$alt" ]; then
              echo "project.yml yok, bulunan dosya kullaniliyor: $alt"
              cp "$alt" project.yml
            fi
          fi

          for f in project.yml build.gradle settings.gradle YZSohbet/Views.swift; do
            if [ ! -f "$f" ]; then
              echo "HATA: $f bulunamadi. project.yml dosyasini depoda ana klasore (YZSohbet-proje.zip ile ayni yere) yukle."
              echo "Depodaki dosyalar:"
              ls -la
              exit 1
            fi
          done
          echo "Tum dosyalar tamam."

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: XcodeGen kur
        run: brew install xcodegen

      - name: Xcode surumunu goster
        run: xcodebuild -version

      - name: IPA derle
        run: gradle buildIpa --console=plain

      - name: IPA dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: YZSohbet-ipa
          path: build/ipa/YZSohbet.ipa
          if-no-files-found: error
